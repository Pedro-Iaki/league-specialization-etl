name: 'league_pipeline'
version: '1.0.0'

profile: 'league_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  league_pipeline:
    bronze:
      +schema: bronze
    silver:
      +schema: silver
    gold:
      +schema: gold

vars:
  late_arrival_lookback_days: 5
  mastery_freshness_days: 2
  rank_period_days: 7
  active_champion_activity_window_days: 60
  active_champion_min_absolute_points: 3000
  active_champion_min_relative_pct: 0.10
  active_champion_immature_window_fraction: 0.5
  role_profile_recent_champion_count: 15
  ranked_queue: "RANKED_SOLO_5x5"

  divisions_per_tier: 4
  lp_per_division: 100

  expert_mastery_threshold: 100000
  cooccurrence_min_pair_players: 5

  favoured_champion_max_count: 10
  favoured_champion_gap_multiplier: 1.5
  favoured_champion_min_log_gap: 0.69314718056
  playstyle_feature_weights:
    top1_share: 0.30
    favoured_share: 0.15
    hhi: 0.25
    normalized_entropy: 0.15
    favoured_count: 0.15
  playstyle_profiles:
    specialist:
      top1_share: 0.75
      favoured_share: 0.90
      hhi: 0.60
      normalized_entropy: 0.25
      favoured_count: 0.10
    multispecialist:
      top1_share: 0.42
      favoured_share: 0.90
      hhi: 0.32
      normalized_entropy: 0.45
      favoured_count: 0.22
    versatile:
      top1_share: 0.30
      favoured_share: 0.75
      hhi: 0.20
      normalized_entropy: 0.70
      favoured_count: 0.44
    generalist:
      top1_share: 0.15
      favoured_share: 0.70
      hhi: 0.08
      normalized_entropy: 0.95
      favoured_count: 1.00
