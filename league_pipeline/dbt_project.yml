name: 'league_pipeline'
version: '1.0.0'

profile: 'league_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  league_pipeline:
    bronze:
      +schema: bronze
    silver:
      +schema: silver
    gold:
      +schema: gold

vars:
  late_arrival_lookback_days: 5
  dedup_days_range: 7
  mastery_freshness_days: 2