name: 'league_pipeline'
version: '1.0.0'

profile: 'league_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  league_pipeline:
    bronze:
      +schema: bronze
    silver:
      +schema: silver
    gold:
      +schema: gold

vars:
  late_arrival_lookback_days: 5
  dedup_minutes_range: "{{ env_var('FRESHNESS_THRESHOLD_MINUTES', '1440') | int }}"
  mastery_freshness_days: 2
  active_champion_activity_window_days: 60
  active_champion_min_absolute_points: 3000
  active_champion_min_relative_pct: 0.10
  active_champion_immature_window_fraction: 0.5
  role_profile_recent_champion_count: 15
  ranked_queue: "RANKED_SOLO_5x5"
