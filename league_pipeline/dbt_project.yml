name: 'league_pipeline'
version: '1.0.0'

profile: 'league_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  league_pipeline:
    bronze:
      +schema: bronze
    silver:
      +schema: silver
    gold:
      +schema: gold

vars:
  late_arrival_lookback_days: 5
  dedup_minutes_range: "{{ env_var('FRESHNESS_THRESHOLD_MINUTES', '1440') | int }}"
  mastery_freshness_days: 2
  active_champion_activity_window_days: 60
  active_champion_min_absolute_points: 3000
  active_champion_min_relative_pct: 0.10
  active_champion_immature_window_fraction: 0.5
  role_profile_recent_champion_count: 15
  ranked_queue: "RANKED_SOLO_5x5"
  
  # ladder geometry (consumed by absolute_lp and rank_state_order)
  divisions_per_tier: 4
  lp_per_division: 100

  # champion analysis
  expert_mastery_threshold: 100000
  high_elo_min_tier_order: 7      # DIAMOND and above
  low_elo_max_tier_order: 4       # IRON through GOLD
  cooccurrence_min_pair_players: 5

  # player profile
  flex_main_role_threshold: 0.5
  recent_form_window_days: 28

  # rank transitions
  rank_transition_lookback_days: 90
  rank_transition_max_period_days: 7

  # trajectory windows on mart_player_delta_history
  trajectory_short_window_days: 14
  trajectory_long_window_days: 28
