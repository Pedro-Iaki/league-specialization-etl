version: 2

sources:
  - name: raw
    description: Raw Delta tables populated from the Riot API extraction and Databricks ingestion jobs.
    schema: raw
    tables:
      - name: players
        description: Ranked player snapshots loaded from Riot league entries, before dbt deduplication and normalization.
        columns:
          - name: puuid
            description: Riot's globally unique player identifier.
            tests: [not_null]
          - name: region
            description: Riot platform routing region used for extraction.
            tests: [not_null]
          - name: queueType
            description: Ranked queue associated with the snapshot.
            tests: [not_null]
          - name: tier
            description: Ranked tier reported by the Riot API.
            tests: [not_null]
          - name: rank
            description: Ranked division reported by the Riot API.
            tests: [not_null]
          - name: date
            description: Extraction date encoded as yyMMdd.
            tests: [not_null]
          - name: _ingested_at
            description: Timestamp assigned when Databricks ingests the source file.
            tests: [not_null]

      - name: masteries
        description: Champion mastery snapshots loaded from Riot champion-mastery responses, before dbt deduplication and normalization.
        columns:
          - name: puuid
            description: Riot's globally unique player identifier.
            tests: [not_null]
          - name: championId
            description: Numeric identifier supplied by the mastery API; raw data may include separate mode-specific variants, such as League Classic champion IDs, that are absent from the standard Data Dragon roster.
            tests: [not_null]
          - name: championPoints
            description: Cumulative mastery points recorded at extraction time.
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: true
          - name: date
            description: Extraction date encoded as yyMMdd.
            tests: [not_null]
          - name: _ingested_at
            description: Timestamp assigned when Databricks ingests the source file.
            tests: [not_null]

      - name: champions
        description: Current champion metadata and position classifications assembled from Data Dragon and the League of Legends Wiki.
        columns:
          - name: key
            description: Numeric champion identifier used by champion-mastery records.
            tests: [not_null, unique]
          - name: name
            description: Human-readable champion name.
            tests: [not_null, unique]
          - name: id
            description: Stable string identifier used by Data Dragon.
            tests: [not_null, unique]
          - name: patch
            description: Data Dragon patch from which the champion metadata was loaded.
            tests: [not_null]
