version: 2

models:
  - name: mart_player_population_standardization
    description: Tier-specific valid metric counts and direct-standardized means for all profiles and active/all-time classified cohorts. Each region/queue/cohort/metric has all ten reference tiers. Means are conditional on tiers meeting minimum support; coverage is metric-specific. Recent outcomes use current tier and observed profiles, not historical starting-tier cohorts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [region, queue, cohort, metric, tier]
    columns:
      - name: tier
        tests: [not_null]
      - name: cohort
        tests: [not_null]
      - name: metric
        tests: [not_null]
      - name: metric_players
        description: Nonmissing observations for this metric and tier after selecting the cohort.
        tests: [not_null]
      - name: tier_supported
        description: One if valid metric count meets population_min_tier_players (default 5).
      - name: standardized_mean
        description: Sum of supported reference shares times tier means divided by supported reference coverage; repeated across tier rows. Null when no tier meets minimum support.
      - name: covered_population_share
        description: Reference mass of tiers meeting this metric's minimum support. Compare with population_min_coverage (default 0.99).
      - name: coverage_status
        tests:
          - accepted_values:
              arguments:
                values: [no_supported_tiers, low_coverage, adequate_coverage]
