version: 2

models:
  - name: fct_players_champion_delta_history
    description: Mastery gained by player and champion between observed snapshots.
    columns:
      - name: champion_delta_id
        tests: [not_null, unique]
      - name: days_period
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [player_id, champion_key, snapshot_date]}

  - name: fct_players_champion_activity
    description: Recent activity for champions present in each player's mastery data.
    columns:
      - name: player_champion_activity_id
        tests: [not_null, unique]
      - name: recent_champion_points
        tests: [not_null]
      - name: recent_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: is_active
        tests: [not_null]

  - name: fct_players_rank_history
    description: Rank, game, and ladder-score changes for each observed player interval.
    columns:
      - name: rank_delta_id
        tests: [not_null, unique]
      - name: period_in_days
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, inclusive: true}
      - name: is_counter_reset
        tests: [not_null]

  - name: fct_players_rank_recent_form
    description: Rank performance over the current trailing window.
    columns:
      - name: player_form_id
        tests: [not_null, unique]
      - name: win_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: fct_players_mastery_profile
    description: Lifetime mastery concentration and playstyle at player grain.
    columns:
      - name: player_id
        tests: [not_null, unique]
      - name: mastery_top1_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: mastery_favoured_champion_count
        description: Champions above the strongest qualifying log gap, capped at ten.
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 10}
      - name: mastery_favoured_champions_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: mastery_hhi
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: mastery_normalized_entropy
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: mastery_playstyle
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}

  - name: dim_players_naive_role_distribution
    description: Initial player role distribution inferred from recently used champions and metadata positions.
    columns:
      - name: player_id
        tests: [not_null, unique]

  - name: dim_champion_role_weights
    description: Empirical champion role weights inferred from the role distributions of associated players.
    columns:
      - name: champion_key
        tests: [not_null, unique]

  - name: dim_players_active_pool
    description: Current active champion pool, role mix, concentration, and playstyle for each player.
    columns:
      - name: player_id
        tests: [not_null, unique]
      - name: active_champion_count
        tests: [not_null]
      - name: pool_top1_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: pool_favoured_champion_count
        description: Active champions above the strongest qualifying log gap, capped at ten.
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 10}
      - name: pool_favoured_champions_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: pool_hhi
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: pool_normalized_entropy
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: playstyle
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}

  - name: mart_player_profile
    description: Final current profile at one row per player.
    columns:
      - name: player_id
        tests: [not_null, unique]
      - name: tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [IRON, BRONZE, SILVER, GOLD, PLATINUM, EMERALD, DIAMOND, MASTER, GRANDMASTER, CHALLENGER]
      - name: win_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: rank_score
        description: Cross-tier ladder score used to compare rank height and calculate movement.
      - name: metadata_primary_roles
        description: Tied role candidates from recent champions before empirical champion-role weighting.
      - name: active_playstyle
        description: Archetype inferred from the current active champion pool.
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}
      - name: alltime_playstyle
        description: Archetype inferred from the player's lifetime mastery distribution.
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}

  - name: mart_player_delta_history
    description: Final player-period analysis linking rank growth to champions and playstyle.
    columns:
      - name: rank_delta_id
        tests: [not_null, unique]
      - name: period_win_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: playstyle
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}

  - name: fct_players_period_pool_profile
    description: Champion-pool concentration and playstyle for each valid player rank interval.
    columns:
      - name: rank_delta_id
        tests: [not_null, unique]
      - name: favoured_champion_count
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 10}
      - name: favoured_champions_share
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: playstyle
        tests:
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}

  - name: mart_champion_profile
    description: Final overall champion profile for popularity, rank height, mastery, roles, and observed growth.
    columns:
      - name: champion_key
        tests: [not_null, unique]
      - name: champion_name
        tests: [not_null]
      - name: active_play_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: observed_win_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: mart_champion_playstyle_profile
    description: Champion performance at one row per champion and player playstyle.
    columns:
      - name: champion_playstyle_id
        tests: [not_null, unique]
      - name: champion_key
        tests: [not_null]
      - name: playstyle
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [specialist, multispecialist, versatile, generalist]}
      - name: observed_win_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [champion_key, playstyle]}

  - name: mart_champion_cooccurrence
    description: Final overlap analysis for sufficiently common unordered champion pairs.
    columns:
      - name: champion_pair_id
        tests: [not_null, unique]
      - name: jaccard
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: npmi
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -1, max_value: 1}
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [champion_key_a, champion_key_b]}
